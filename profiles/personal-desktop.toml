name = "personal-desktop"
description = "Personal desktop — server profile + uv + chezmoi-managed Claude Code config"

components = [
    "packages",
    "nvm",
    "bw-cli",
    "uv",
    "git-base",
    "git-identity",
    "ssh-key",
    "credential-helpers",
    "bw-unlock-shell",
    "claude-code",
    "chezmoi",
]

identities = ["personal"]

[component_config.chezmoi]
repo = "https://github.com/delabrcd/claude-config.git"
# Force re-run of the MCP-register run_onchange_ script even when its
# rendered SHA hasn't changed (lets us re-register MCPs after BW becomes
# available on a fresh machine).
reset_entry_key = "register-mcp-servers.sh"
