name = "windows-desktop"
description = "Windows host + WSL Ubuntu — Windows-side git/SSH/identity, then delegates Linux setup to WSL"

components = [
    # Windows host side
    "packages",                # winget: git, gh, python
    "bw-cli",                  # winget: Bitwarden.CLI
    "git-base",                # global git config + ssh-agent service
    "git-identity",            # per-identity user.name/email/signingKey + includeIf
    "ssh-key",                 # per-identity SSH keys → ssh-agent service
    "credential-helpers",      # GCM (shared with WSL via the Windows binary)
    "bw-unlock-shell",         # PowerShell profile bw-unlock function

    # WSL pass — runs bootstrap.sh inside Ubuntu with the same profile name,
    # so all the Linux-only components below also get applied there.
    "wsl-bootstrap",

    # Linux/WSL-only — filtered out on Windows host, runs inside WSL
    "wsl-interop",
    "nvm",
    "uv",
    "claude-code",
    "chezmoi",
]

identities = ["personal"]

[component_config.chezmoi]
repo = "https://github.com/delabrcd/claude-config.git"
reset_entry_key = "register-mcp-servers.sh"

[component_config.wsl-bootstrap]
distro = "Ubuntu"
