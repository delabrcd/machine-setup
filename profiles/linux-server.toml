name = "linux-server"
description = "Headless Linux server template — packages, Claude Code, BW SSH/git for any identities you select"

components = [
    "packages",
    "nvm",
    "bw-cli",
    "git-base",
    "git-identity",            # per-identity → runs once per chosen identity
    "ssh-key",                 # per-identity → SSH key from BW
    "credential-helpers",      # per-identity
    "bw-unlock-shell",
    "claude-code",
]

# Empty by default — the bootstrap discovers identities from Bitwarden
# (items named "Machine Identity: <name>") and shows a picker. Pre-pin
# specific names here if you want to skip the picker, e.g. ["personal"].
identities = []
