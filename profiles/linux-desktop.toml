name = "linux-desktop"
description = "Linux desktop template — server template + uv + chezmoi (configure repo via local/profiles overlay)"

components = [
    "packages",
    "nvm",
    "bw-cli",
    "uv",
    "git-base",
    "git-identity",
    "ssh-key",
    "credential-helpers",
    "bw-unlock-shell",
    "claude-code",
    "chezmoi",
]

identities = []

# chezmoi.repo intentionally not set in the public profile — the chezmoi
# component skips with a warning if no repo is configured. Set it via a
# local/ overlay:
#
#   # local/profiles/linux-desktop.toml
#   [component_config.chezmoi]
#   repo = "https://github.com/<you>/dotfiles.git"
