name = "mcp-context7"
description = "Enable the context7 MCP (live library/framework docs) for Claude Code"
supported = ["linux-ubuntu", "linux-fedora", "linux-arch", "wsl", "windows"]
# Selection is signal-only — chezmoi reads which MCPs are in the plan and
# does the actual `claude mcp add`, including BW secret extraction via its
# bitwardenFields template functions. We pull chezmoi in so the registration
# actually happens. nvm is needed at MCP-call time for `npx`.
depends_on = ["claude-code", "chezmoi", "nvm"]
per_identity = false
