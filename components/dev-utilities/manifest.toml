name = "dev-utilities"
description = "Clone (or reset) an arbitrary git repository to a configured path. Generic — used by work setups to pull internal tooling."
# windows is listed so it's pickable in the Windows TUI; on Windows the
# component is a no-op (no windows.ps1) — installs run inside WSL via the
# state propagated by wsl-bootstrap.
supported = ["linux-ubuntu", "linux-fedora", "linux-arch", "wsl", "windows"]
# Repo is typically cloned via SSH (e.g. git@bitbucket.org:...), so the per-
# identity SSH key + git config must already be applied.
depends_on = ["packages", "ssh-key", "git-identity"]
per_identity = false

# machine.toml component_config:
#   [component_config.dev-utilities]
#   repo = "git@bitbucket.org:workspace/dev-utilities.git"   # required
#   dest = "~/.local/share/dev-utilities"                    # default shown
