name = "dev-utilities"
description = "Clone (or reset) an arbitrary git repository to a configured path. Generic — used by work profiles to pull internal tooling."
supported = ["linux-ubuntu", "linux-fedora", "linux-arch", "wsl"]
depends_on = ["packages"]
per_identity = false

# Profile config (TOML):
#   [component_config.dev-utilities]
#   repo = "git@bitbucket.org:workspace/dev-utilities.git"   # required
#   dest = "~/.local/share/dev-utilities"                    # default shown
