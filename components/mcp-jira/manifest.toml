name = "mcp-jira"
description = "Register the Jira MCP (sooperset/mcp-atlassian via uvx) with Claude Code"
supported = ["linux-ubuntu", "linux-fedora", "linux-arch", "wsl", "windows"]
# uv is needed because mcp-atlassian runs via `uvx mcp-atlassian`.
depends_on = ["claude-code", "bw-cli", "uv"]
runs_after = ["chezmoi"]
per_identity = false

# Override via [component_config.mcp-jira] in machine.toml:
#   bw_item       = "Claude Code MCP Secrets"
#   bw_url_field  = "jira_url"             # e.g. https://yourorg.atlassian.net
#   bw_pat_field  = "jira_personal_token"  # PAT or API token
#   scope         = "user"
