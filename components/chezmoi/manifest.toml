name = "chezmoi"
description = "Apply the bundled chezmoi dotfiles (Claude Code config, MCP server registration)"
supported = ["linux-ubuntu", "linux-fedora", "linux-arch", "wsl", "windows"]
# chezmoi-source/ ships inside this repo. The component runs `chezmoi apply
# --source $MACHINE_SETUP_DIR/chezmoi-source` — no remote clone. It also
# exports MS_MCP_* env vars based on the plan so the MCP register template
# knows which MCPs to wire up.
#
# Identity setup must be done first because the dotfiles' MCP register
# script expects ssh keys + git config in place; uv+nvm are needed because
# the MCPs use uvx / npx.
depends_on = ["claude-code", "uv", "nvm", "ssh-key", "credential-helpers", "git-identity"]
per_identity = false

# Optional override (rare): point at a different chezmoi source dir, e.g.
# a local/chezmoi-source overlay.
#   [component_config.chezmoi]
#   source = "/path/to/chezmoi/source"
