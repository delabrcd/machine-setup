name = "wsl-bootstrap"
description = "Run the full bootstrap inside WSL Ubuntu, inheriting the host's identity + component selections."
supported = ["windows"]
depends_on = ["packages"]
runs_after = ["bw-cli", "ssh-key", "credential-helpers", "chezmoi"]
per_identity = false
# Hand the terminal over while running — the inner WSL bootstrap may need to
# prompt for sudo (Linux side), and capturing its output through a pipe
# would break those prompts.
requires_tty = true

# Profile config:
#   [component_config.wsl-bootstrap]
#   distro = "Ubuntu"             # which WSL distro to dispatch into
#   profile = "personal-server"   # profile to run inside WSL (defaults to the
#                                 #   one running on the host)
